<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; connect-src http://127.0.0.1:* http://localhost:*; media-src 'self' blob: mediastream:; style-src 'self'; font-src 'self'; img-src 'self' data:" />
  <title>Bookwyrm</title>
  <link rel="stylesheet" href="../dist/app.css" />
</head>
<body data-state="idle" data-shape="docked" data-side="left" data-v="up">
  <main class="stage">
    <section class="card" aria-live="polite" aria-label="Bookwyrm">
      <header class="card-head">
        <div>
          <h1 id="title">Bookwyrm</h1>
          <p class="status" id="status">Ready when you are</p>
        </div>
        <button type="button" class="close" id="close" aria-label="Close" title="Close">
          <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3 3l6 6M9 3l-6 6" /></svg>
        </button>
      </header>

      <p class="reason" id="reason" hidden></p>

      <ol class="lines" id="lines"></ol>

      <form class="type" id="type-form" hidden>
        <label class="sr-only" for="type-input">Message Bookwyrm</label>
        <input id="type-input" autocomplete="off" placeholder="Message Bookwyrm" />
      </form>

      <footer class="controls">
        <div class="left">
          <button type="button" id="mute" class="round quiet" aria-pressed="false" aria-label="Mute" title="Mute" hidden>
            <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="7" y="2.5" width="6" height="10" rx="3" /><path d="M4.5 9.5a5.5 5.5 0 0 0 11 0M10 15v2.5" /><path class="slash" d="M3 3l14 14" /></svg>
          </button>
          <button type="button" id="type" class="round quiet" aria-label="Type a message" title="Type a message" hidden>
            <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2" y="5" width="16" height="10" rx="2" /><path d="M5 8h1M8 8h1M11 8h1M14 8h1M6 12h8" /></svg>
          </button>
          <button type="button" id="expand" class="round quiet" aria-label="Open in the Bookwyrm window" title="Open in the Bookwyrm window" hidden>
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M11 3h6v6M17 3l-7 7M9 4H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2v-4" /></svg>
          </button>
        </div>
        <div class="right">
          <button type="button" id="decline" class="pill" hidden>Not now</button>
          <button type="button" id="answer" class="round accept" aria-label="Answer" title="Answer" hidden>
            <svg viewBox="0 0 20 20" aria-hidden="true"><path class="fill" d="M6.6 2.8l1.6 3.4c.2.5.1 1-.3 1.4L6.6 8.8a10 10 0 0 0 4.6 4.6l1.2-1.3c.4-.4.9-.5 1.4-.3l3.4 1.6c.5.2.8.8.7 1.3l-.4 2c-.1.6-.7 1-1.3 1A14.6 14.6 0 0 1 2.3 3.7c0-.6.4-1.2 1-1.3l2-.4c.5-.1 1.1.2 1.3.8z" /></svg>
          </button>
          <button type="button" id="hangup" class="round end" aria-label="Hang up" title="Hang up" hidden>
            <svg viewBox="0 0 20 20" aria-hidden="true"><path class="fill" d="M10 7.5c-2.6 0-5 .7-6.9 2-.5.3-.7.9-.5 1.4l.7 1.8c.2.5.8.8 1.3.7l2.6-.6c.5-.1.8-.5.8-1v-1.6a9.4 9.4 0 0 1 4 0v1.6c0 .5.3.9.8 1l2.6.6c.5.1 1.1-.2 1.3-.7l.7-1.8c.2-.5 0-1.1-.5-1.4-1.9-1.3-4.3-2-6.9-2z" /></svg>
          </button>
        </div>
      </footer>
    </section>

    <button class="robot" id="robot" type="button" aria-label="Bookwyrm" aria-haspopup="menu" title="Bookwyrm">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <defs>
          <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" class="metal-top" /><stop offset="1" class="metal-bottom" />
          </linearGradient>
          <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="1.1" result="b" /><feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
          </filter>
        </defs>
        <ellipse class="ground" cx="32" cy="60.5" rx="13" ry="2" />
        <g class="bot">
          <g class="signal"><path d="M24.5 6.5a10 10 0 0 0 0 9" /><path d="M39.5 6.5a10 10 0 0 1 0 9" /><path d="M21 4a14.5 14.5 0 0 0 0 14" /><path d="M43 4a14.5 14.5 0 0 1 0 14" /></g>
          <rect class="torso" x="22" y="45" width="20" height="11" rx="5.5" />
          <circle class="chest" cx="32" cy="50.5" r="1.6" />
          <path class="antenna" d="M32 13V7.5" />
          <circle class="lamp" cx="32" cy="6" r="2.6" />
          <rect class="ear" x="7.5" y="24" width="5" height="12" rx="2.5" />
          <rect class="ear" x="51.5" y="24" width="5" height="12" rx="2.5" />
          <rect class="head" x="11" y="12" width="42" height="35" rx="12.5" />
          <path class="ribbon" d="M41 11h4.6v11.5l-2.3-1.9-2.3 1.9z" />
          <rect class="screen" x="16" y="18" width="32" height="23" rx="7.5" />
          <g class="face" filter="url(#glow)">
            <g class="eyes">
              <rect class="eye" x="22.5" y="24" width="5.5" height="9" rx="2.75" />
              <rect class="eye" x="36" y="24" width="5.5" height="9" rx="2.75" />
            </g>
            <rect class="mouth" x="29" y="35.2" width="6" height="1.6" rx="0.8" />
          </g>
        </g>
      </svg>
      <span class="badge" id="badge" hidden>1</span>
    </button>
  </main>
  <audio id="remote" autoplay></audio>
  <script src="../dist/app.js"></script>
</body>
</html>
